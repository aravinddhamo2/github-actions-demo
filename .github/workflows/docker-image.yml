name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest
    env:
      ACR_NAME: demohgreds.azurecr.io
    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: cd 03-app-dotnet && docker build . --file Dockerfile --tag ${{env.ACR_NAME}}/dotnet:${{github.run_number}}

    - name: Docker Login
      uses: docker/login-action@v4.6.0
      with:
        # Server address of Docker registry. If not set then will default to Docker Hub
        registry: ${{env.ACR_NAME}}
        # Username used to log against the Docker registry
        username: demohgreds
        # Password or personal access token used to log against the Docker registry
        password: ${{secrets.ACR_CREDS}}
        
    - name: Docker Push
      run: docker push ${{env.ACR_NAME}}/dotnet:${{github.run_number}}

    
